<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/branding/masalto-isotipo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E30613" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/branding/masalto-icon-192.svg" />
    <meta name="description" content="Editor de planos Layher Allround — MásAlto Estructuras" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <title>MasAlto Layout · Editor de Planos Layher</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'activated' && navigator.serviceWorker.controller) {
          const banner = document.createElement('div');
          banner.setAttribute('style','position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#E30613;color:#fff;padding:10px 20px;border-radius:8px;font-family:Nunito Sans,system-ui;font-size:14px;z-index:9999;display:flex;align-items:center;gap:12px;box-shadow:0 4px 12px rgba(0,0,0,.3)');
          banner.innerHTML='Nueva versión disponible <button onclick="location.reload()" style="background:#fff;color:#E30613;border:none;padding:4px 12px;border-radius:4px;font-weight:700;cursor:pointer">Actualizar</button>';
          document.body.appendChild(banner);
        }
      });
    });
  });
}
</script>
  </body>
</html>
